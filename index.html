<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessible Carousel</title>
  <style>
    :root{--controls:#0faea6}
    body{font-family:system-ui,Arial;margin:0;background:#f6fcfc;color:#033;}
    .carousel{max-width:980px;margin:36px auto;position:relative;overflow:hidden;border-radius:12px}
    .track{display:flex;transition:transform .45s ease;will-change:transform}
    .slide{min-width:100%;box-sizing:border-box;flex-shrink:0;position:relative}
    .slide img{display:block;width:100%;height:420px;object-fit:cover}
    .controls{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none}
    .controls button{pointer-events:auto;background:rgba(255,255,255,0.9);border:0;padding:10px;border-radius:999px;box-shadow:0 4px 14px rgba(2,20,20,0.12);cursor:pointer}
    .dots{display:flex;gap:8px;position:absolute;left:50%;transform:translateX(-50%);bottom:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.6);border:0}
    .dot[aria-current="true"]{background:var(--controls)}
    @media (max-width:600px){ .slide img{height:260px} }
  </style>
</head>
<body>
  <main>
    <section class="carousel" aria-roledescription="carousel" aria-label="Featured dives">
      <div class="track" id="track">
        <div class="slide" data-index="0">
          <img src="images/gallery-1.jpg" alt="Diver near coral reef" loading="lazy" width="1600" height="900">
        </div>
        <div class="slide" data-index="1">
          <img src="images/gallery-2.jpg" alt="Boat at sunset" loading="lazy" width="1600" height="900">
        </div>
        <div class="slide" data-index="2">
          <img src="images/gallery-3.jpg" alt="School of fish underwater" loading="lazy" width="1600" height="900">
        </div>
      </div>

      <div class="controls" aria-hidden="false">
        <button id="prev" aria-label="Previous slide">‹</button>
        <button id="next" aria-label="Next slide">›</button>
      </div>

      <div class="dots" role="tablist" aria-label="Slide dots" id="dots"></div>
    </section>
  </main>

  <script>
    (function(){
      const track = document.getElementById('track');
      const slides = [...track.children];
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const dotsContainer = document.getElementById('dots');
      let index = 0, autoplay = true, interval = 5000, timer;

      function renderDots(){
        slides.forEach((s,i)=>{
          const btn = document.createElement('button');
          btn.className = 'dot';
          btn.setAttribute('role','tab');
          btn.setAttribute('aria-selected', i===0 ? 'true' : 'false');
          btn.dataset.index = i;
          btn.addEventListener('click', ()=>goTo(i));
          dotsContainer.appendChild(btn);
        });
        updateDots();
      }

      function updateDots(){
        [...dotsContainer.children].forEach((d,i)=>{
          d.setAttribute('aria-current', i===index ? 'true' : 'false');
          d.setAttribute('aria-selected', i===index ? 'true' : 'false');
        });
      }

      function goTo(i){
        index = (i + slides.length) % slides.length;
        track.style.transform = `translateX(-${index * 100}%)`;
        updateDots();
        resetTimer();
      }

      prev.addEventListener('click', ()=>goTo(index-1));
      next.addEventListener('click', ()=>goTo(index+1));
      document.addEventListener('keydown', e => { if(e.key === 'ArrowLeft') prev.click(); if(e.key === 'ArrowRight') next.click(); });

      function startTimer(){ if(autoplay) timer = setInterval(()=>goTo(index+1), interval); }
      function resetTimer(){ clearInterval(timer); startTimer(); }

      renderDots();
      startTimer();
    })();
  </script>
</body>
</html>
